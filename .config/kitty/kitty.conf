# Mirrors alacritty.toml. Colours come from noctalia's kitty template
# (themes/noctalia.conf, generated, untracked); per-host overrides such as
# font_size live in host.conf next to this file, also untracked.
include themes/noctalia.conf

font_family      JetBrains Mono
font_size        11.25
# Alacritty never draws ligatures
disable_ligatures always

cursor_shape            beam
cursor_beam_thickness   1.2
cursor_shape_unfocused  unchanged
cursor_blink_interval   0
cursor_trail            0

background_opacity      0.9
# kitty padding is in pt, alacritty's 8 is in px
window_padding_width    6
hide_window_decorations yes

shell /bin/zsh

# Alacritty defaults: no bell, no close prompt, no update nagging
enable_audio_bell        no
confirm_os_window_close  0
update_check_interval    0

globinclude host.conf
