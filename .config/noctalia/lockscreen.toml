    box_width = 176
    cx = 1008.0
    cy = 630.0
    output = "eDP-1"
    placement_height = 1260
    placement_width = 2016
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 0.0
        center_password_text = true
        input_opacity = 0.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = false
        show_media = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-clock@FALLBACK"]
    box_height = 200
    box_width = 352
    cx = 960.0
    cy = 437.6
    output = "FALLBACK"
    placement_height = 1080
    placement_width = 1920
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget."lockscreen-clock@FALLBACK".settings]
        background_opacity = 0.0
