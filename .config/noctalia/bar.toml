# Bar layout, mirroring the old waybar module set but keeping noctalia's own
# rounded geometry.
#
# custom/calendar is replaced by the native calendar service, see
# calendar.toml. hyprland/submap comes back via the hypr-submap plugin.

[plugins]
enabled = ["k4n4t4/hypr-submap"]

[bar.default]
position             = "top"
thickness            = 30
background_opacity   = 0.5
radius               = 0
radius_bottom_left   = 6
radius_bottom_right  = 6
concave_edge_corners = false
margin_ends          = 12
margin_edge          = 0
border               = "outline"
border_width         = 0.0
padding              = 12
widget_spacing       = 5
font_family          = "JetBrains Mono NL Medium"
font_weight          = 300
capsule              = true
capsule_fill         = "on_primary"
capsule_opacity      = 0.5
capsule_padding      = 8.0
capsule_thickness    = 1.0
shadow               = false
reserve_space        = true
scale                = 1.15

start  = ["workspaces", "submap"]
center = ["audio_visualizer"]
end    = [
  "tray",
  "keyboard_layout",
  "bluetooth",
  "ram",
  "volume",
  "network",
  "notifications",
  "battery",
  "clock",
]

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.workspaces]
active_pill_size    = 1.0
inactive_pill_size  = 0.5
focused_output_only = true
hide_when_empty     = true
show_icons          = false
show_labels         = false

[widget.audio_visualizer]
bands = 15
width = 123

# Only visible while a submap is active, like waybar's hyprland/submap.
[widget.submap]
type              = "k4n4t4/hypr-submap:hypr-submap"
hide_when_default = true
glyph             = "keyboard"

[widget.clock]
format         = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.keyboard_layout]
display                 = "short"
hide_when_single_layout = true
