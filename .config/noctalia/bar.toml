# Bar layout, mirroring the old waybar module set but keeping noctalia's own
# floating, rounded geometry.
#
# Not ported: hyprland/submap (no equivalent widget). custom/calendar is
# replaced by the native calendar service, see calendar.toml.

[bar.default]
position             = "top"
thickness            = 34
background_opacity   = 0.5
radius               = 0
radius_bottom_left   = 30
radius_bottom_right  = 19
concave_edge_corners = false
margin_ends          = 12
margin_edge          = 0
border               = "outline"
border_width         = 0.0
padding              = 12
widget_spacing       = 16
font_family          = "JetBrains Mono NL Medium"
font_weight          = 300
capsule              = false
capsule_fill         = "error"
shadow               = true
reserve_space        = true
scale                = 1.15

start  = ["workspaces"]
center = ["audio_visualizer"]
end    = [
  "tray",
  "keyboard_layout",
  "bluetooth",
  "ram",
  "volume",
  "network",
  "notifications",
  "battery",
  "clock",
]

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.clock]
format         = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.keyboard_layout]
display                 = "short"
hide_when_single_layout = true
