# Bar layout, mirroring the old waybar module set but keeping noctalia's own
# floating, rounded geometry.
#
# Not ported: hyprland/submap (no equivalent widget). custom/calendar is
# replaced by the native calendar service, see calendar.toml.

[bar.default]
position           = "top"
thickness          = 34
background_opacity = 1.0
radius             = 12
margin_ends        = 180
margin_edge        = 10
padding            = 14
widget_spacing     = 6
shadow             = true
capsule            = false
reserve_space      = true
scale              = 1.15

start  = ["workspaces"]
center = ["audio_visualizer"]
end    = [
  "tray",
  "keyboard_layout",
  "bluetooth",
  "ram",
  "volume",
  "network",
  "notifications",
  "battery",
  "clock",
]

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.clock]
format         = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.keyboard_layout]
display                 = "short"
hide_when_single_layout = true
