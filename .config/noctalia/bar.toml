# Bar layout, mirroring the old waybar module set but keeping noctalia's own
# rounded geometry.
#
# custom/calendar is replaced by the native calendar service, see
# calendar.toml. hyprland/submap comes back via the hypr-submap plugin.

[plugins]
enabled = ["k4n4t4/hypr-submap"]

[bar.default]
position             = "top"
thickness            = 34
background_opacity   = 0.8
radius               = 0
radius_bottom_left   = 34
radius_bottom_right  = 34
concave_edge_corners = false
margin_ends          = 12
margin_edge          = 0
border               = "outline"
border_width         = 0.0
padding              = 12
widget_spacing       = 16
font_family          = "JetBrains Mono NL Medium"
font_weight          = 300
capsule              = false
capsule_fill         = "error"
shadow               = true
reserve_space        = true
scale                = 1.15

start  = ["workspaces", "submap"]
center = ["audio_visualizer"]
end    = [
  "tray",
  "keyboard_layout",
  "bluetooth",
  "ram",
  "volume",
  "network",
  "notifications",
  "battery",
  "clock",
]

[widget.ram]
type = "sysmon"
stat = "ram_used"

# Only visible while a submap is active, like waybar's hyprland/submap.
[widget.submap]
type              = "k4n4t4/hypr-submap:hypr-submap"
hide_when_default = true
glyph             = "keyboard"

[widget.clock]
format         = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.keyboard_layout]
display                 = "short"
hide_when_single_layout = true
