# Bar layout, mirroring the old waybar module set.
#
# Not ported: hyprland/submap (no equivalent widget) and custom/calendar (the
# calcurse "next appointment" script - noctalia's text widget is static and
# custom_button has no command output, so this needs a plugin or a hook).

[bar.default]
position           = "top"
thickness          = 26
background_opacity = 0.7
radius             = 0
margin_ends        = 0
margin_edge        = 0
padding            = 10
widget_spacing     = 8
shadow             = false
capsule            = false
reserve_space      = true
scale              = 1.15

start  = ["workspaces"]
center = ["audio_visualizer"]
end    = [
  "tray",
  "keyboard_layout",
  "bluetooth",
  "ram",
  "volume",
  "network",
  "notifications",
  "battery",
  "clock",
]

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.clock]
format         = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.keyboard_layout]
display                 = "short"
hide_when_single_layout = true
