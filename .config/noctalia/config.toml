# Noctalia shell configuration.
# Hand-written base layer; GUI changes land in ~/.local/state/noctalia/settings.toml
# and override anything set here.

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "Paradise"

# Approximate the old rofi/waybar look: square corners, monospace, no shadows
# (shadows and blur were turned off compositor-side too).
[shell]
corner_radius_scale = 0.0
font_family         = "JetBrains Mono"

[shell.shadow]
alpha = 0.0

[shell.panel]
transparency_mode = "soft"
borders           = true
shadow            = false
launcher_placement = "floating"
launcher_position  = "center"

# rofi showed a plain, tight, icon-only-left list.
[shell.launcher]
categories                = false
compact                   = true
app_grid                  = false
show_icons                = true
show_app_origin_indicator = false

[wallpaper]
directory = "~/.local/share/wallpapers"
fill_mode = "crop"

[wallpaper.default]
path = "~/.local/share/wallpapers/bg.png"

# Auto-detection does not associate the Apple panel backlight with eDP-1,
# and the HDMI TV speaks no DDC/CI, so both are pinned explicitly.
[brightness]
enable_ddcutil = false

[brightness.monitor.eDP-1]
backend          = "backlight"
backlight_device = "apple-panel-bl"

[brightness.monitor.HDMI-A-1]
backend = "none"
