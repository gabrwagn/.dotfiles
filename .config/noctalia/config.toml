# Noctalia shell configuration.
# Hand-written base layer; GUI changes land in ~/.local/state/noctalia/settings.toml
# and override anything set here.

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "Paradise"

# Both catalogs are off. With them enabled and no ids selected, noctalia's
# "undo templates you did not select" pass rewrote configs it does not own:
# on 2026-09-09 it stripped `import = [...]` and the `[font]` header out of
# alacritty.toml, and appended to hyprland.lua. Everything under ~/.config is
# a stow symlink into this repo, so those edits land straight in git.
# Do not enable without pointing template outputs somewhere unmanaged.
[theme.templates]
enable_builtin_templates   = false
enable_community_templates = false

# Keep noctalia's own rounding on panels and popups; only the font is carried
# over from the old waybar/rofi look.
[shell]
corner_radius_scale = 1.0
font_family         = "JetBrains Mono"
password_style      = "default"
input_borders       = false
card_borders        = false
popup_borders       = false

[shell.shadow]
alpha = 0.55

[shell.panel]
transparency_mode = "glass"
borders           = true
shadow            = true
launcher_placement = "floating"
launcher_position  = "center"

# rofi showed a plain, tight, icon-only-left list.
[shell.launcher]
categories                = false
compact                   = true
app_grid                  = false
show_icons                = false
show_app_origin_indicator = false

[wallpaper]
directory = "~/.local/share/wallpapers"
fill_mode = "crop"

[wallpaper.default]
path = "~/.local/share/wallpapers/bg.png"

# Auto-detection does not associate the Apple panel backlight with eDP-1,
# and the HDMI TV speaks no DDC/CI, so both are pinned explicitly.
[brightness]
enable_ddcutil = false

[brightness.monitor.eDP-1]
backend          = "backlight"
backlight_device = "apple-panel-bl"

[brightness.monitor.HDMI-A-1]
backend = "none"
