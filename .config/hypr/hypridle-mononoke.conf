# mononoke: always-on homeserver media box.
# Never suspend -- jellyfin must stay up. Locking is fine, that's it.

general {
    lock_cmd = noctalia msg session lock                           # noctalia owns the lock screen
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# No backlight dimming / keyboard backlight / panel blanking on the desktop:
# nothing lights a backlight and the apple-dcp driven TV must not get dpms-off
# (it loses the DP2HDMI link on power-down). Suspend intentionally omitted.