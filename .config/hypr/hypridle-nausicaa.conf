
general {
    lock_cmd = noctalia msg session lock                           # noctalia owns the lock screen
    before_sleep_cmd = loginctl lock-session                       # lock before suspend.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    # Only blank the laptop panel. Do NOT dpms-off the external HDMI:
    # the apple-dcp driver loses the DP2HDMI link on power-down and the
    # display flaps (valid_mode:0) until a full restart. When docked, eDP
    # is disabled so this is a harmless no-op and the TV stays alive.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off", "eDP-1")'                   # blank laptop panel only
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on", "eDP-1")' && brightnessctl -r  # unblank + restore backlight
}

