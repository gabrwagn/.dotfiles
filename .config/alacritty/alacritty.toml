[cursor]
style = "beam"
thickness = 0.2
unfocused_hollow = false

# Multi-line on purpose. noctalia's alacritty template hook (apply.sh) injects
# its import with a sed range `/^import.*\[/,/\]/` -- a sed range cannot close
# on the line it opened, so a single-line array leaves the range open until the
# next line containing `]`, which was `[font]`. That is what corrupted this
# file on 2026-09-09. Keeping the array multi-line gives the range a `]` of its
# own to close on. The hook is also a no-op while "noctalia.toml" appears below,
# since apply.sh short-circuits on that string.
[general]
import = [
    "~/.config/alacritty/host.toml",
    "~/.config/alacritty/themes/noctalia.toml",
]

[font]
size = 11.25 # default, overridden by host.toml if it exists

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0


[terminal.shell]
program = "/bin/zsh"

[window.padding]
x = 8
y = 8

[window]
opacity=0.9


